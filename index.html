<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lisbon — Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --canvas:#fff; --ink:#222; --body:#3f3f3f; --mut:#6a6a6a; --muted-soft:#929292;
  --line:#ddd; --line-soft:#ebebeb; --soft:#f7f7f7; --soft-2:#f2f2f2;
  --primary:#ff385c; --primary-a:#e00b41;
  --sh:0 0 0 1px rgba(0,0,0,.02),0 2px 6px rgba(0,0,0,.04),0 4px 8px rgba(0,0,0,.1);
  --sh-up:0 -4px 20px rgba(0,0,0,.10);
  --peek:238px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink);
  font-family:"Airbnb Cereal VF",Circular,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
body{display:flex;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* ---------------- map ---------------- */
#map{flex:1;height:100vh;height:100dvh;background:var(--soft);z-index:1}
.leaflet-container{font:inherit}
.leaflet-bar{border:none!important;box-shadow:var(--sh)!important;border-radius:999px!important;overflow:hidden}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;color:var(--ink)!important;
  border-color:var(--line-soft)!important;font-size:18px!important}
.leaflet-control-attribution{background:rgba(255,255,255,.86)!important;color:var(--mut)!important;
  font-size:10px!important;padding:2px 6px!important;border-radius:6px 0 0 0}
.leaflet-control-layers{border:none!important;box-shadow:var(--sh)!important;border-radius:12px!important;
  font-size:13px!important;padding:8px 10px!important;color:var(--ink)!important}

/* pins */
.mkwrap{transform:translateZ(0)}
.mk{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  color:#fff;font-size:12px;font-weight:700;letter-spacing:-.2px;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .12s}
.mk.approx{opacity:.78}
.leaflet-marker-icon:hover .mk{transform:scale(1.12)}
.clwrap{background:none;border:none}
.cl{display:flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 8px;
  border-radius:999px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;
  border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* ---------------- panel / sheet ---------------- */
#sheet{position:relative;width:396px;flex:0 0 396px;background:var(--canvas);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0;z-index:1100}
.grab{display:none}
.shead{padding:18px 18px 0;flex:0 0 auto}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.2px;line-height:1.18}
.sub{margin-top:2px;font-size:13px;color:var(--mut);line-height:1.3}
.searchrow{display:flex;gap:8px;align-items:center;margin-top:14px}
.searchpill{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:48px;padding:0 16px;
  background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh);
  transition:border-color .15s,box-shadow .15s}
.searchpill:focus-within{border-color:var(--ink);box-shadow:var(--sh),0 0 0 1px var(--ink)}
.searchpill svg{flex:0 0 16px;color:var(--ink)}
#search{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink)}
#search::placeholder{color:var(--mut)}
.orb{flex:0 0 48px;width:48px;height:48px;border-radius:999px;border:0;background:var(--primary);
  color:#fff;display:grid;place-items:center;box-shadow:var(--sh);transition:background .15s,transform .1s}
.orb:active{transform:scale(.95)}
.orb.on{background:var(--ink)}
.orb[disabled]{background:#ffd1da;cursor:default}

.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding:14px 0 2px;margin:0 -18px;padding-left:18px;padding-right:18px}
.chiprow::-webkit-scrollbar{display:none}
.rowwrap{position:relative}
.rowwrap::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44px;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 78%);opacity:1;transition:opacity .18s}
.rowwrap.atend::after{opacity:0}
.chiprow.days{padding-top:8px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);margin-bottom:0}
.chip,.itin{height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
  white-space:nowrap;flex:0 0 auto;transition:background .12s,color .12s,border-color .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip:hover,.itin:hover{background:var(--soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.chip.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.itin.on{background:var(--primary);border-color:var(--primary);color:#fff}

#list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none}
#list::-webkit-scrollbar{display:none}
.item{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line-soft);
  cursor:pointer;align-items:center;transition:background .12s;-webkit-tap-highlight-color:transparent}
.item:hover{background:var(--soft)}
.item:active{background:var(--soft-2)}
.thumbwrap{position:relative;flex:0 0 78px}
.item img.th{width:78px;height:78px;border-radius:12px;object-fit:cover;display:block;background:var(--soft-2)}
.item .n{position:absolute;left:5px;top:5px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;
  color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.item .body{min-width:0;flex:1}
.item .t{font-size:15px;font-weight:600;line-height:1.28;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{margin-top:2px;font-size:13px;color:var(--mut);line-height:1.32;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.item .hrs{margin-top:2px;font-size:12px;color:var(--muted-soft);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{flex:0 0 auto;padding:11px 18px;border-top:1px solid var(--line-soft);font-size:13px;
  color:var(--mut);background:var(--canvas)}

/* ---------------- popup ---------------- */
.leaflet-popup-content-wrapper{background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:0}
.leaflet-popup-content{margin:0;padding:12px 14px 14px;width:auto!important}
.leaflet-popup-tip{box-shadow:none}
.pop .gal{display:flex;gap:6px;margin:-12px -14px 10px;padding:10px;overflow-x:auto;scrollbar-width:none;
  border-radius:16px 16px 0 0;background:var(--soft)}
.pop .gal::-webkit-scrollbar{display:none}
.pop .gal img{height:104px;width:auto;border-radius:10px;object-fit:cover;cursor:zoom-in;flex:0 0 auto}
.pop h3{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.pop .a{font-size:13px;color:var(--mut);margin:2px 0 8px}
.pop .line{font-size:13.5px;color:var(--body);margin:3px 0;line-height:1.35}
.pop .line b{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.3px;margin-right:4px}
.pop .btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;
  margin:10px 6px 0 0;border-radius:8px;background:var(--primary);color:#fff;font-size:14px;font-weight:500;
  text-decoration:none}
.pop .btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.pop .warn{font-size:12px;color:#b32505;margin-top:8px;line-height:1.3}
.pop .cred{font-size:10.5px;color:var(--muted-soft);margin-top:8px;line-height:1.3}

/* ---------------- lightbox ---------------- */
#lb{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.94);display:none;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#lb.on{display:flex}
#lb .lbbar{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff}
#lb .lbname{font-size:14px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .lbcnt{font-size:13px;color:#b9b9b9;font-variant-numeric:tabular-nums}
#lb button{width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.12);
  color:#fff;font-size:18px;display:grid;place-items:center}
#lb .stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:none}
#lb-img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .16s,transform .12s;user-select:none}
#lb-img.zoomed{cursor:grab}
#lb-img.dragging{transition:none}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;font-size:26px}
#lb .prev{left:10px} #lb .next{right:10px}
#lb .cap{color:#9d9d9d;font-size:11.5px;text-align:center;padding:10px 16px 14px;line-height:1.3}

/* ================= MOBILE: bottom sheet ================= */
@media(max-width:760px){
  html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
  #map{position:fixed;inset:0;height:100dvh}
  #sheet{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;
    height:92dvh;border-right:0;border-radius:20px 20px 0 0;box-shadow:var(--sh-up);
    transform:translateY(calc(100% - var(--peek)));
    transition:transform .32s cubic-bezier(.32,.72,0,1);will-change:transform}
  #sheet.dragging{transition:none;user-select:none;-webkit-user-select:none}
  .grab{display:grid;place-items:center;height:26px;flex:0 0 26px;touch-action:none;cursor:grab;
    -webkit-tap-highlight-color:transparent}
  .grab span{width:40px;height:5px;border-radius:99px;background:#d9d9d9}
  .shead{padding:2px 16px 0;touch-action:pan-y}
  h1,.sub{display:none}          /* the map is the hero on mobile */
  .searchrow{margin-top:10px}
  .searchpill{height:48px;padding:0 14px}
  #search{font-size:16px}           /* 16px stops iOS focus zoom */
  .chiprow{padding-top:12px;margin:0 -16px;padding-left:16px;padding-right:16px;touch-action:pan-x}
  .chiprow.days{padding-bottom:10px}
  .item{padding:11px 16px}
  .thumbwrap{flex:0 0 76px}
  .item img.th{width:76px;height:76px;border-radius:12px}
  .item .t{font-size:14.5px}
  .item .meta{font-size:12.5px}
  .count{padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));font-size:12px}
  #list{padding-bottom:2px}
  .leaflet-bottom{bottom:calc(var(--peek) + 6px)!important}
  .leaflet-top .leaflet-control{margin-top:10px}
  .leaflet-popup-content{margin:0;padding:10px 12px 12px}
  .pop .gal{margin:-10px -12px 9px;padding:8px}
  .pop .gal img{height:86px}
  .pop h3{font-size:15px}
  .leaflet-popup-content{max-width:calc(100vw - 48px)!important}
}
@media(min-width:761px){ #sheet{height:100vh;height:100dvh} }
</style></head><body>
<div id="map"></div>
<div id="sheet" class="s-peek">
  <div class="grab" id="grab"><span></span></div>
  <div class="shead">
    <h1>Lisbon</h1>
    <div class="sub" id="subline"></div>
    <div class="searchrow">
      <label class="searchpill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
        <input id="search" type="search" placeholder="Search places" autocomplete="off" enterkeyhint="search"
               aria-label="Search places">
      </label>
      <button id="nearme" class="orb" aria-label="Sort by distance from me">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>
      </button>
    </div>
    <div class="rowwrap"><div class="chiprow" id="filters"></div></div>
    <div class="rowwrap"><div class="chiprow days" id="itins"></div></div>
  </div>
  <div id="list"></div>
  <div class="count" id="count"></div>
</div>
<div id="lb" aria-hidden="true" role="dialog" aria-label="Photo viewer">
  <div class="lbbar"><span class="lbname" id="lb-name"></span><span class="lbcnt" id="lb-cnt"></span>
    <button id="lb-x" aria-label="Close">✕</button></div>
  <div class="stage" id="lb-stage">

    <button class="nav next" id="lb-next" aria-label="Next photo">›</button>
  </div>
  <div class="cap" id="lb-cap"></div>
</div>

imageinfo&utm_content=thumbnail"],"photo_src":"pt.wikipedia.org/wiki/Oceanário_de_Lisboa","hours":"","website":"https://www.oceanario.pt/","phone":"+351 218 917 000","wiki":"https://pt.wikipedia.org/wiki/Oceanário_de_Lisboa"},{"name":"Teatro Camões","area":"Parque das Nações","num":188,"lat":38.7609,"lon":-9.09335,"approx":true,"color":"#16a085","photos":["https://upload.wikimedia.org/wikipedia/commons/9/9a/Teatro_Camoes_Lisboa.JPG?utm_source=pt.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled","https://upload.wikimedia.org/wikipedia/commons/9/9a/Teatro_Camoes_Lisboa.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled"],"photo_src":"pt.wikipedia.org/wiki/Teatro_Camões","hours":"","website":"https://www.cnb.pt/gca/?id=42","phone":"","wiki":"https://pt.wikipedia.org/wiki/Teatro_Camões"},{"name":"Estação Ferroviária de Braço de Prata","area":"Parque das Nações","num":189,"lat":38.746653,"lon":-9.103042,"approx":true,"color":"#16a085","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Esta%C3%A7%C3%A3o_ferrovi%C3%A1ria_de_Bra%C3%A7o_de_Prata1.jpg/960px-Esta%C3%A7%C3%A3o_ferrovi%C3%A1ria_de_Bra%C3%A7o_de_Prata1.jpg?utm_source=pt.wikipedia.org&utm_campaign=api&utm_content=thumbnail"],"photo_src":"pt.wikipedia.org/wiki/Estação_Ferroviária_de_Braço_de_Prata","hours":"","website":"","phone":"","wiki":"https://pt.wikipedia.org/wiki/Estação_Ferroviária_de_Braço_de_Prata"},{"name":"Palácio da Mitra (Marvila)","area":"Parque das Nações","num":190,"lat":38.739712,"lon":-9.103167,"approx":true,"color":"#16a085","photos":["https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_001.jpg/960px-Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_001.jpg?utm_source=pt.wikipedia.org&utm_campaign=api&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_001.jpg/960px-Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_001.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_01.jpg/960px-Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_01.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_03.jpg/960px-Pal%C3%A1cio_da_Mitra_%28Marvila%29%2C_Lisboa_03.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail"],"photo_src":"pt.wikipedia.org/wiki/Palácio_da_Mitra_(Marvila)","hours":"","website":"","phone":"","wiki":"https://pt.wikipedia.org/wiki/Palácio_da_Mitra_(Marvila)"}],"unmapped":[],"itins":{"Day 1 - Baixa, Chiado & Alfama":["Museu da Farmácia","Elevador da Bica","Palácio Valada-Azambuja","Praça de Luís de Camões","Palácio Quintela","Teatro São Luiz","Teatro Nacional de São Carlos","Museu Nacional de Arte Contemporânea do Chiado","Basílica de Nossa Senhora dos Mártires","Teatro da Trindade","Igreja de São Roque"],"Day 2 - Belém & the River":["Torre de Belém","Museu de Arte Popular (Portugal)","Museu de Arte Contemporânea do Centro Cultural de Belém","Centro Cultural de Belém","Jardim da Praça do Império","Museu Nacional de Arqueologia","Mosteiro dos Jerónimos","Museu de Marinha","Museu de Arte Contemporânea - Centro Cultural de Belém","Padrão dos Descobrimentos","Jardins do Palácio de Belém"],"Day 3 - Bairro Alto & Beyond":["Igreja de Nossa Senhora do Amparo (Benfica)","Estação Ferroviária de Benfica","Aqueduto das Águas Livres","Palácio dos Marqueses de Fronteira","Apeadeiro de Cruz da Pedra","Teatro Talia","Estação Ferroviária de Sete Rios","Teatro Aberto","Museu Calouste Gulbenkian","Centro de Arte Moderna Gulbenkian","Palacete Mendonça"]},"colors":{"Alfama & Castelo":"#c0392b","Baixa & Chiado":"#8e44ad","Bairro Alto & Estrela":"#1f6feb","Belém & Ajuda":"#0e8a6d","Alcântara & Riverside":"#d68910","Avenidas & North":"#7f8c8d","Parque das Nações":"#16a085"},"icons":{"Alfama & Castelo":"🏰","Baixa & Chiado":"🏛️","Bairro Alto & Estrela":"🎭","Belém & Ajuda":"⛵","Alcântara & Riverside":"🌉","Avenidas & North":"🌳","Parque das Nações":"🚡"},"halal":[],"supers":[],"city":"Lisbon"};
</script>
<script>
const IS_MOBILE=()=>window.innerWidth<=760;
const PEEK=()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--peek'))||196;
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([38.7223,-9.1393],12);
L.control.zoom({position:IS_MOBILE()?'bottomright':'topleft'}).addTo(map);

const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services";
const ATTR='Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors';
const STREET=L.tileLayer(ESRI+'/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:ATTR}).addTo(map);
const TOPO=L.tileLayer(ESRI+'/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:ATTR});
const SAT=L.tileLayer(ESRI+'/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:ATTR});
const OSM=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
const baseLayers={'Street':STREET,'Topographic':TOPO,'Satellite':SAT};
if(location.protocol.startsWith('http')) baseLayers['OpenStreetMap']=OSM;
L.control.layers(baseLayers,{},{position:IS_MOBILE()?'bottomright':'topright',collapsed:true}).addTo(map);

const cluster=L.markerClusterGroup?L.markerClusterGroup({
  maxClusterRadius:IS_MOBILE()?48:58, showCoverageOnHover:false, spiderfyOnMaxZoom:true,
  disableClusteringAtZoom:17,
  iconCreateFunction:c=>L.divIcon({html:'<div class="cl">'+c.getChildCount()+'</div>',
    className:'clwrap',iconSize:[40,40]})}):null;
if(cluster) map.addLayer(cluster);

document.getElementById('subline').textContent =
  DATA.pois.length+' destinations · '+DATA.pois.filter(p=>p.photos.length).length+' with photos';

/* ---------------- sheet ---------------- */
const sheet=document.getElementById('sheet'),grab=document.getElementById('grab');
let snapState=IS_MOBILE()?'peek':'desktop', sheetY=0, drag=null, rafId=0, pendY=0;

function snaps(){
  const h=sheet.offsetHeight, max=Math.max(0,h-PEEK());
  return {full:0, half:Math.round(max*0.52), peek:max};
}
function paint(){ sheet.style.transform='translate3d(0,'+sheetY+'px,0)'; }
function setSheet(s,anim){
  if(!IS_MOBILE()){sheet.style.transform='none';snapState='desktop';return;}
  snapState=s;
  if(anim){ sheet.classList.remove('dragging'); }
  else { sheet.classList.add('dragging'); }
  sheetY=snaps()[s]||0;
  paint();
  if(!anim){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(!drag) sheet.classList.remove('dragging'); })); }
  if(s!=='full'){ const l=document.getElementById('list'); if(l) l.scrollTop=0; }
}
function onDown(e){
  if(!IS_MOBILE()||drag) return;
  if(e.target.closest('input,button,a,label,.chiprow,.rowwrap')) return;
  drag={id:e.pointerId, y:e.clientY, base:sheetY, moved:0, t:Date.now()};
  pendY=sheetY;
  sheet.classList.add('dragging');
  try{ sheet.setPointerCapture(e.pointerId); }catch(_){}
}
function onMove(e){
  if(!drag||e.pointerId!==drag.id) return;
  const dy=e.clientY-drag.y;
  drag.moved=Math.max(drag.moved,Math.abs(dy));
  const {peek}=snaps();
  pendY=Math.min(Math.max(-24,drag.base+dy),peek+48);
  if(rafId) return;
  rafId=requestAnimationFrame(()=>{ rafId=0; sheetY=pendY; paint(); });
}
function onUp(e){
  if(!drag) return;
  const d=drag; drag=null;
  if(e && e.pointerId!==undefined && e.pointerId!==d.id) return;
  if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
  sheetY=pendY; paint();
  const sp=snaps();
  if(d.moved<10){
    setSheet(snapState==='peek'?'half':(snapState==='half'?'full':'peek'),true);
    return;
  }
  const dt=Math.max(1,Date.now()-d.t), vel=(pendY-d.base)/dt;   // px per ms
  let best='peek',bd=1e9;
  Object.keys(sp).forEach(k=>{ const dd=Math.abs(sp[k]-sheetY); if(dd<bd){bd=dd;best=k;} });
  if(Math.abs(vel)>0.55){                                       // fling: one step past
    const order=['full','half','peek'];
    const i=order.indexOf(best);
    best=order[Math.min(order.length-1,Math.max(0,i+(vel>0?1:-1)))];
  }
  if(sheetY>=sp.peek+24) best='peek';                           // near-collapsed drag
  if(d.moved>10){ window.__justDragged=true; setTimeout(()=>{window.__justDragged=false;},60); }
  setSheet(best,true);
}
grab.addEventListener('pointerdown',onDown,{passive:false});
document.querySelector('.shead').addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',()=>{ if(!drag) return; drag=null; if(rafId){cancelAnimationFrame(rafId);rafId=0;} setSheet(snapState,true); });
/* swallow the click that follows a drag */
document.querySelector('.shead').addEventListener('click',e=>{
  if(window.__justDragged){ e.stopPropagation(); e.preventDefault(); }
},true);
document.getElementById('search').addEventListener('focus',()=>{if(IS_MOBILE()&&snapState!=='full') setSheet('full',true);});

/* ---------------- filters ---------------- */
const active=new Set(Object.keys(DATA.colors));
let query='',itinLine=null,activeItin=null,userPos=null,meDot=null;
const fbox=document.getElementById('filters');
Object.entries(DATA.colors).forEach(([area,col])=>{
  const c=document.createElement('button'); c.className='chip on'; c.dataset.area=area;
  c.innerHTML='<span class="dot" style="background:'+col+'"></span>'+DATA.icons[area]+' '+area.split(' ')[0];
  c.onclick=()=>{ if(active.has(area)){active.delete(area);c.classList.remove('on');}
                  else{active.add(area);c.classList.add('on');} render(); };
  fbox.appendChild(c);
});
const ibox=document.getElementById('itins');
Object.keys(DATA.itins).forEach(d=>{
  const SHORT={'Day 1 - Baixa, Chiado & Alfama':'Day 1 · Baixa & Alfama',
               'Day 2 - Belém & the River':'Day 2 · Belém',
               'Day 3 - Bairro Alto & Beyond':'Day 3 · Bairro Alto'};
  const b=document.createElement('button'); b.className='itin'; b.textContent=SHORT[d]||d;
  b.onclick=()=>{
    document.querySelectorAll('.itin').forEach(x=>x.classList.remove('on'));
    if(activeItin===d){activeItin=null;if(itinLine){map.removeLayer(itinLine);itinLine=null;}}
    else{activeItin=d;b.classList.add('on');drawItin(d);}
  };
  ibox.appendChild(b);
});
function drawItin(d){
  if(itinLine){map.removeLayer(itinLine);itinLine=null;}
  const pts=DATA.itins[d].map(n=>DATA.pois.find(p=>p.name===n)).filter(Boolean).map(p=>[p.lat,p.lon]);
  if(pts.length>1){
    itinLine=L.polyline(pts,{color:'#ff385c',weight:4,opacity:.9,dashArray:'1 9',lineCap:'round'}).addTo(map);
    map.fitBounds(itinLine.getBounds(),{padding:[40,40]});
  }
}
/* ---------------- popups ---------------- */
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function popupFor(p){
  const gm='https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lon;
  const gal=p.photos.length?('<div class="gal" data-poi="'+escAttr(p.name)+'">'+
      p.photos.map((u,i)=>'<img src="'+u+'" loading="lazy" alt="'+escAttr(p.name)+'" data-i="'+i+'" draggable="false">').join('')+'</div>'):'';
  const hours=p.hours?('<div class="line"><b>Hours</b> '+escAttr(p.hours)+'</div>'):'';
  const tel=p.phone?('<div class="line"><b>Tel</b> '+escAttr(p.phone)+'</div>'):'';
  const web=p.website?('<div class="line"><a href="'+escAttr(p.website)+'" target="_blank" rel="noopener">Official site ↗</a></div>'):'';
  const cred=p.photo_src?('<div class="cred">Photos: '+escAttr(p.photo_src)+' (CC)</div>'):'';
  const dist=userPos?('<div class="line"><b>Distance</b> '+fmtDist(hav(userPos,[p.lat,p.lon]))+' walk</div>'):'';
  return '<div class="pop">'+gal+'<h3>'+escAttr(p.name)+'</h3><div class="a">'+escAttr(p.area)+'</div>'+
    dist+hours+tel+web+
    '<a class="btn" href="'+gm+'" target="_blank" rel="noopener">Directions</a>'+
    '<a class="btn alt" href="https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lon+'" target="_blank" rel="noopener">Maps</a>'+
    (p.approx?'<div class="warn">Approximate location — verify before walking.</div>':'')+cred+'</div>';
}
function hav(a,b){const R=6371000,r=Math.PI/180;
  const dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));}
function fmtDist(d){return d<950?Math.round(d)+' m':(d/1000).toFixed(1)+' km';}

/* ---------------- near me ---------------- */
document.getElementById('nearme').onclick=function(){
  const btn=this;
  if(userPos){
    userPos=null;btn.classList.remove('on');btn.setAttribute('aria-label','Sort by distance from me');
    if(meDot){map.removeLayer(meDot);meDot=null;} render(); return;
  }
  if(!navigator.geolocation){alert('Geolocation is not supported by this browser.');return;}
  btn.disabled=true;
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos=[pos.coords.latitude,pos.coords.longitude];
    btn.disabled=false;btn.classList.add('on');
    meDot=L.circleMarker(userPos,{radius:9,color:'#fff',weight:3,fillColor:'#ff385c',fillOpacity:1})
      .addTo(map).bindPopup('You are here');
    map.setView(userPos,15);
    if(IS_MOBILE()) setSheet('half',true);
    render();
  },err=>{btn.disabled=false;alert('Could not get your location: '+err.message);},
  {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
};

/* ---------------- render ---------------- */
const markers=[];
function render(){
  markers.forEach(m=>{ if(cluster) cluster.removeLayer(m); else map.removeLayer(m); });
  markers.length=0;
  const list=document.getElementById('list'); list.innerHTML='';
  const q=query.trim().toLowerCase(); let shown=0;
  const rows=DATA.pois.filter(p=>{
    if(!active.has(p.area)) return false;
    if(q&&!(p.name.toLowerCase().includes(q)||p.area.toLowerCase().includes(q))) return false;
    return true;
  });
  if(userPos) rows.sort((a,b)=>hav(userPos,[a.lat,a.lon])-hav(userPos,[b.lat,b.lon]));
  const padBottom=()=>IS_MOBILE()?[16,PEEK()+70]:[12,12];
  rows.forEach(p=>{
    shown++;
    const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],
      html:'<div class="mkwrap"><div class="mk '+(p.approx?'approx':'')+'" style="background:'+p.color+'">'+p.num+'</div></div>'})});
    m.bindPopup(popupFor(p),{maxWidth:Math.max(220,Math.min(340,window.innerWidth-48)),
      autoPanPaddingTopLeft:[16,16],autoPanPaddingBottomRight:padBottom()});
    if(cluster) cluster.addLayer(m); else m.addTo(map);
    markers.push(m);

    const d=userPos?hav(userPos,[p.lat,p.lon]):null;
    const meta=[p.area+(p.approx?' · approx':''), d!==null?fmtDist(d):''].filter(Boolean).join(' · ');
    const hrs=p.hours?('🕐 '+(p.hours.length>34?p.hours.slice(0,32)+'…':p.hours)):'';
    const it=document.createElement('article'); it.className='item'; it.tabIndex=0;
    it.innerHTML='<div class="thumbwrap">'+
      (p.photos.length?'<img class="th" src="'+p.photos[0]+'" loading="lazy" alt="">':
        '<div class="th"></div>')+
      '<span class="n" style="background:'+p.color+'">'+p.num+'</span></div>'+
      '<div class="body"><div class="t">'+escAttr(p.name)+'</div>'+
      '<div class="meta">'+escAttr(meta)+'</div>'+
      (hrs?'<div class="hrs">'+escAttr(hrs)+'</div>':'')+'</div>';
    const go=()=>{
      if(IS_MOBILE()) setSheet('peek',true);
      map.setView([p.lat,p.lon],Math.max(map.getZoom(),17),{animate:false});
      setTimeout(()=>{
        if(m._map) m.openPopup();
        else map.openPopup(popupFor(p),[p.lat,p.lon],
          {maxWidth:Math.max(220,Math.min(340,window.innerWidth-48)),
           autoPanPaddingTopLeft:[16,16],autoPanPaddingBottomRight:padBottom()});
      },60);
    };
    it.onclick=go;
    it.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
    list.appendChild(it);
  });
  let ctext=shown+' of '+DATA.pois.length+' places';
  if(userPos) ctext+=' · nearest first';
  document.getElementById('count').textContent=ctext;
}

/* ---------------- lightbox ---------------- */
const LB=document.getElementById('lb'),LBI=document.getElementById('lb-img'),
      LBN=document.getElementById('lb-name'),LBC=document.getElementById('lb-cnt'),
      LBCAP=document.getElementById('lb-cap'),LBST=document.getElementById('lb-stage');
let lbList=[],lbIdx=0,lbName='',lbCredit='',lbZoom=1,lbPX=0,lbPY=0;
function applyT(){LBI.style.transform='translate('+lbPX+'px,'+lbPY+'px) scale('+lbZoom+')';}
function setZoom(z){lbZoom=z;if(z<=1){lbPX=0;lbPY=0;}LBI.classList.toggle('zoomed',z>1);applyT();}
function lbPaint(fade){
  const paint=()=>{LBI.src=lbList[lbIdx];LBI.alt=lbName;LBN.textContent=lbName;
    LBC.textContent=lbList.length>1?(lbIdx+1)+' / '+lbList.length:'';
    LBCAP.textContent=lbCredit?lbName+' — '+lbCredit:'';setZoom(1);
    [lbIdx-1,lbIdx+1].forEach(k=>{if(lbList[k]){const im=new Image();im.src=lbList[k];}});};
  if(fade){LBI.style.opacity=0;setTimeout(()=>{paint();LBI.style.opacity=1;},90);}else paint();
}
function openLB(name,idx){
  const p=DATA.pois.find(x=>x.name===name);
  if(!p||!p.photos||!p.photos.length) return;
  lbList=p.photos;lbName=p.name;lbCredit=p.photo_src||'';
  lbIdx=Math.max(0,Math.min(idx||0,lbList.length-1));
  LB.classList.add('on');LB.setAttribute('aria-hidden','false');
  document.getElementById('lb-prev').style.display=lbList.length>1?'':'none';
  document.getElementById('lb-next').style.display=lbList.length>1?'':'none';
  lbPaint(false);
}
function closeLB(){LB.classList.remove('on');LB.setAttribute('aria-hidden','true');
  setTimeout(()=>{if(!LB.classList.contains('on')){LBI.removeAttribute('src');LBI.style.transform='';}},200);
  lbZoom=1;lbPX=lbPY=0;}
function lbGo(d){if(lbList.length<2)return;lbIdx=(lbIdx+d+lbList.length)%lbList.length;setZoom(1);lbPaint(true);}
document.getElementById('lb-x').onclick=closeLB;
document.getElementById('lb-prev').onclick=e=>{e.stopPropagation();lbGo(-1);};
document.getElementById('lb-next').onclick=e=>{e.stopPropagation();lbGo(1);};
LB.addEventListener('click',e=>{if(e.target===LB||e.target===LBST) closeLB();});
document.addEventListener('click',e=>{
  const img=e.target.closest('.gal img'); if(!img) return;
  const box=img.closest('.gal');
  openLB(box.dataset.poi,parseInt(img.dataset.i||'0',10));
});
document.addEventListener('keydown',e=>{
  if(!LB.classList.contains('on')) return;
  if(e.key==='Escape') closeLB();
  else if(e.key==='ArrowLeft') lbGo(-1);
  else if(e.key==='ArrowRight') lbGo(1);
  else if(e.key==='+'||e.key==='=') setZoom(lbZoom>1?1:2.4);
});
let lbDrag=null,lbLastTap=0;
LBST.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')) return;
  lbDrag={x:e.clientX,y:e.clientY,px:lbPX,py:lbPY,moved:0,zoom:lbZoom};
  LBI.classList.add('dragging');
});
LBST.addEventListener('pointermove',e=>{
  if(!lbDrag) return;
  const dx=e.clientX-lbDrag.x,dy=e.clientY-lbDrag.y;
  lbDrag.moved=Math.max(lbDrag.moved,Math.hypot(dx,dy));
  if(lbDrag.zoom>1){lbPX=lbDrag.px+dx;lbPY=lbDrag.py+dy;applyT();}
  else if(Math.abs(dx)>6){LBI.style.transform='translateX('+(dx*0.3)+'px)';}
});
LBST.addEventListener('pointerup',e=>{
  if(!lbDrag) return;
  const d=lbDrag;lbDrag=null;LBI.classList.remove('dragging');
  const dx=e.clientX-d.x;
  if(d.zoom>1){lbPX=d.px;lbPY=d.py;applyT();if(d.moved<12)setZoom(1);return;}
  LBI.style.transform='';
  if(Math.abs(dx)>55){lbGo(dx<0?1:-1);return;}
  if(d.moved<12){const now=Date.now();if(now-lbLastTap<330){setZoom(2.4);lbLastTap=0;}else lbLastTap=now;}
});
LBST.addEventListener('pointercancel',()=>{lbDrag=null;LBI.classList.remove('dragging');LBI.style.transform='';});

/* ---------------- wiring ---------------- */
let qT;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(qT); const v=e.target.value;
  qT=setTimeout(()=>{query=v;render();},90);
});
function fadeRows(){
  document.querySelectorAll('.chiprow').forEach(el=>{
    const wrap=el.closest('.rowwrap'); if(!wrap) return;
    const more=(el.scrollWidth-el.clientWidth-el.scrollLeft)>6;
    wrap.classList.toggle('atend',!more);
  });
}
document.querySelectorAll('.chiprow').forEach(el=>el.addEventListener('scroll',fadeRows,{passive:true}));
let rzT;
window.addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    map.invalidateSize();
    if(!IS_MOBILE()){sheet.style.transform='none';snapState='desktop';}
    else if(snapState==='desktop'){setSheet('peek',false);}
    else setSheet(snapState,false);
    fadeRows();
  },180);
});
window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),350));
if(IS_MOBILE()) setSheet('peek',false); else setSheet('desktop',false);
render(); fadeRows(); window.addEventListener('load',fadeRows);
setTimeout(()=>map.invalidateSize(),300);
</script></body></html>
